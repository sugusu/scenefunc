[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nala"
version = "0.1.0"
description = "NaLA: 3D Native LLM Layout Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NaLA Authors" }]
dependencies = [
  "torch>=2.1",
  "transformers>=4.40",
  "peft>=0.10",
  "deepspeed>=0.14",
  "trimesh",
  "numpy",
  "scipy",
  "tqdm",
  "tensorboard",
  "loguru",
  "gorilla",
  "shapely",
  "Pillow",
  "pybullet",
]

[project.optional-dependencies]
linux = ["spconv-cu121"]

[tool.setuptools.packages.find]
where = ["src"]
